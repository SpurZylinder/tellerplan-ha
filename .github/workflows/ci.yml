name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen; die CI braucht keine Schreibrechte
permissions:
  contents: read

# Actions auf Commit-SHAs festgeschrieben (siehe release.yml)
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tellerplan/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tellerplan/app/requirements*.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest
