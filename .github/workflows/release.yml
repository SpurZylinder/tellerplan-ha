name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus config.yaml lesen und mit Tag vergleichen
        id: version
        run: |
          version=$(yq -r '.version' tellerplan/config.yaml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag passt nicht zu version $version in tellerplan/config.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: arm64-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: tellerplan
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=aarch64
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/tellerplan-aarch64:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/tellerplan-aarch64:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
