name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# Actions sind auf Commit-SHAs festgeschrieben (Tags ließen sich nachträglich umhängen);
# die Version steht im Kommentar. Aktualisieren: neue SHA per
# `git ls-remote https://github.com/<owner>/<action> refs/tags/<version>` holen.
jobs:
  image:
    # Nativer arm64-Runner: kein QEMU, kein emuliertes pip install
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version aus config.yaml lesen und mit Tag vergleichen
        id: version
        run: |
          # sed statt yq: yq ist auf dem arm64-Runner nicht sicher vorinstalliert
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' tellerplan/config.yaml)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::version in tellerplan/config.yaml nicht gefunden"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag passt nicht zu version $version in tellerplan/config.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ohne Build-Cache: Ein Tag-Lauf kann den Cache anderer Tags nicht lesen, und so
      # entsteht jedes Image frisch aus requirements.txt
      - name: arm64-Image bauen und veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tellerplan
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=aarch64
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/tellerplan-aarch64:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/tellerplan-aarch64:latest
