name: Tellerplan
version: "0.3.0"
slug: tellerplan
description: Kalorien zählen, Rezepte verwalten und die Woche planen
url: https://github.com/SpurZylinder/tellerplan-ha
arch:
  - aarch64
image: ghcr.io/spurzylinder/tellerplan-{arch}
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:silverware-fork-knife
panel_title: Tellerplan
# Supervisor-API: Die Einstellseite speichert die eigenen Optionen (siehe docs/Architektur.md)
hassio_api: true
# Home-Assistant-API: Die Einkaufsliste ruft todo.add_item für die Bring-Liste auf
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Vollbild-App (Anmeldung über Home Assistant) und JSON-API (nur mit Token)
backup: hot
options:
  daily_kcal_limit: 2000
  protein_goal_g: 150
  fat_goal_g: 70
  carbs_goal_g: 200
  meal_names:
    - Frühstück
    - Mittag
    - Abendessen
    - Snacks
  plan_default_meal: Abendessen
  ranking_protein_weight: 0.7
  pantry_keywords:
    - salz
    - pfeffer
    - gemüsebrühe
    - paprikapulver
    - currypulver
    - kreuzkümmel
    - zimt
    - muskatnuss
    - oregano
    - mehl
    - zucker
    - backpulver
    - natron
    - stärke
    - öl
    - essig
    - wasser
  bring_list_entity: ""
  homeassistant_url: ""
  api_token: ""
  database_path: /data/app.db
schema:
  daily_kcal_limit: int(500,10000)
  protein_goal_g: int(0,500)
  fat_goal_g: int(0,500)
  carbs_goal_g: int(0,1000)
  meal_names:
    - str
  plan_default_meal: str
  ranking_protein_weight: float(0,1)
  pantry_keywords:
    - str
  bring_list_entity: match(^(todo\.\w+)?$)
  homeassistant_url: match(^(https?://[^/\s]+)?$)
  api_token: password
  database_path: str
