[project]
name = "tellerplan"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "db", "main", "migrate", "modules", "scripts", "security", "serve", "settings", "web", "conftest", "factories"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
