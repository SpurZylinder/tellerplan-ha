[project]
name = "tellerplan"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "clock", "cookidoo", "db", "files", "ha_auth", "ha_users", "main", "migrate", "modules", "scripts", "security", "serve", "settings", "supervisor", "web", "web_sessions", "conftest", "factories"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

# Abdeckung nur als Bericht in der CI, ohne Mindestwert (entschieden 2026-11-13)
[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
