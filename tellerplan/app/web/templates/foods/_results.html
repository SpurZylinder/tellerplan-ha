{% if foods %}
  <ul class="list">
    {% for food in foods %}
      <li>
        <div class="grow">
          <a href="{{ url('food_detail', food_id=food.id) }}">{{ food.name }}</a>
          <span class="nums">
            <span class="pill k">{{ food.kcal|num }} kcal</span>
            <span class="pill p">{{ food.protein_g|num(1) }} g Eiweiß</span>
            <span class="meta">je 100 g</span>
          </span>
        </div>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="empty">Nichts gefunden.</p>
{% endif %}
