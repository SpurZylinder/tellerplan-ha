{% extends "base.html" %}

{% block title %}Heute · Tellerplan{% endblock %}

{% block content %}
  <header>
    <h1>Heute</h1>
    <p class="lede">Tageslimit <span class="pill k">{{ daily_kcal_limit }} kcal</span></p>
  </header>

  {% for meal in meal_names %}
    <section>
      <h2>{{ meal }}</h2>
      <p class="empty">Noch keine Einträge.</p>
    </section>
  {% endfor %}
{% endblock %}
